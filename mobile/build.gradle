apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'


android {
    // 与最新平台 API 保持对齐（AGP 8.1.1 最高支持 compileSdk 34，故用 34）
    compileSdk 34
    ndkVersion "25.2.9519653"

    lint {
        baseline = file("lint-baseline.xml") // 添加这一行
    }
    defaultConfig {
        applicationId "net.activitywatch.android"
        minSdkVersion 24
        targetSdkVersion 34

        // Set in CI on tagged commit
        // FIXME: should be set before tagging, so that F-droid picks it up correctly
        //        https://gitlab.com/fdroid/fdroiddata/-/merge_requests/11786?commit_id=d2cedcbe3d26db59378d582a8cf952af16b6407f#note_1966750559
        versionName "0.13.0"

        // Set in CI by `bundle exec fastlane update_version`
        versionCode 35

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // NOTE: This only works for API level 28 and above
        //testInstrumentationRunnerArguments useTestStorageService: 'true'

        // WARNING: Never commit this uncommented! (leads to huge APKs)
        //packagingOptions {
        //    doNotStrip '**/*.so'
        //}
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a" // 按需选择架构
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            // firebaseCrashlytics {
            //     nativeSymbolUploadEnabled true
            // }
        }
        debug {
            applicationIdSuffix ".debug"
            jniDebuggable true
            renderscriptDebuggable true
        }
    }
    compileOptions {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
    namespace 'net.activitywatch.android'
    // Never got this to work...
    //if (project.hasProperty("doNotStrip")) {
    //    packagingOptions {
    //        doNotStrip '**/*.so'
    //    }
    //}

    // Creates a resource versionName with the full version
    // https://stackoverflow.com/a/36468650/965332
    applicationVariants.all { variant ->
        variant.resValue "string", "versionName", 'v' + variant.versionName
    }

    buildFeatures {
        viewBinding true
    }
}

// ======================
// 🚨 新增：SO 文件强制检查 - Modified definition
// ======================
// 定义必检的 SO 文件（架构+路径）
// 注意：这个定义放在了 android { ... } 块外面，这是有效的 Gradle 语法
def mandatorySoFiles = [
    "arm64-v8a/libaw_server.so",  // 主流 64 位设备（必选）
    // "armeabi-v7a/libaw_server.so" // 兼容 32 位设备（可选，可删除）
]
task checkRequiredSoFiles { // Removed (type: Check), defaults to DefaultTask
    description = "🔍 检查必需的 SO 文件是否存在"
    group = "Verification"

    doLast { // Added doLast block - 将检查逻辑放在 doLast 块中
        mandatorySoFiles.each { soPath -> // 这个 mandatorySoFiles 变量在这里可以访问到
            def soFile = file("build/rustJniLibs/android/$soPath")
            if (!soFile.exists()) {
                throw new GradleException(
                    "\n❌ 构建失败：缺失必需的 SO 文件\n" +
                    "文件路径：$soFile.absolutePath\n" +
                    "修复建议：\n" +
                    "1. 确保 Rust 模块（aw-server-rust）已正确编译\n" +
                    "2. 手动将 SO 文件复制到 jniLibs 对应架构目录\n" +
                    "3. 运行命令：./gradlew cargoBuild（如使用 Rust 插件）"
                )
            }
        }
    }
}
// ======================

// ======================
// 将检查绑定到所有构建类型（debug/release）
// ======================
/*
tasks.withType(com.android.build.gradle.tasks.PreBuildTask).all { // <--- Original line 108
    dependsOn checkRequiredSoFiles
}
*/
// ======================
preBuild.dependsOn checkRequiredSoFiles
// 确保检查在 Rust 库（cargoBuild 会输出到 build/rustJniLibs）之后执行
checkRequiredSoFiles.dependsOn 'cargoBuild'

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // 活动页「概览 / 时间线 / 趋势」三 Tab 切换
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.annotation:annotation:1.5.0'

    implementation 'com.google.android.material:material:1.7.0'
    implementation 'com.jakewharton.threetenabp:threetenabp:1.4.3'
    implementation(platform("com.google.firebase:firebase-bom:32.3.1")) 
    implementation("com.google.firebase:firebase-analytics")
    implementation("com.google.firebase:firebase-crashlytics")
    implementation 'com.google.firebase:firebase-crashlytics-ndk:18.4.2'

    // Markdown 渲染（笔记展示）
    implementation 'io.noties.markwon:core:4.6.2'

    // ===== WiFi 热点传输（实验性）：扫码 / 出码（含 zxing core，生成二维码用）=====
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // ===== 同步模块依赖 =====
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // 协程
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit-ktx:$extJUnitVersion"
    androidTestImplementation "androidx.test:runner:$androidXTestVersion"
    androidTestImplementation "androidx.test:rules:$androidXTestVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$espressoVersion"
    androidTestUtil "androidx.test.services:test-services:$servicesVersion"
    androidTestImplementation "androidx.test.espresso:espresso-web:$espressoVersion"
}

// ===== Rust 原生库：用 rust-android-gradle 插件接管（替代 Makefile 的 make -C aw-server-rust android）=====
// 之前禁用是栽在 openssl-src 编 OpenSSL 找不到合适 perl（Git perl 缺模块、Strawberry 被拒）。
// 升级到 0.9.x 后用 cargo { exec { ... } } 注入 OPENSSL_SRC_PERL（MSYS2 perl）即可解决，彻底不碰 make。
apply plugin: 'org.mozilla.rust-android-gradle.rust-android'

cargo {
    // aw-server-rust 是 workspace 根，cargo build 会产出 libaw_server.so（与 Makefile 行为一致）
    module  = "../aw-server-rust"
    libname = "aw_server"
    // 只编 abiFilters 发布的架构：arm=armeabi-v7a, arm64=arm64-v8a（与 ndk.abiFilters 对齐）
    targets = ["arm", "arm64"]
    profile = 'release'   // release 编一次，debug/release 共用（debug 也可运行，仅缺 debug 符号）

    // openssl-src 从源码编 OpenSSL 时通过 OPENSSL_SRC_PERL 指定的 perl 调用 Configure。
    // Windows 必须用 MSYS2 的 perl（C:/msys64/usr/bin/perl.exe）：cygwin 风格路径 + 模块齐全，
    // 既不会像 Git perl 那样缺 Locale::Maketext::Simple，也不会像 Strawberry(MSWin32) 被 Configure 拒。
    // Linux/macOS/CI 用系统 perl，无需显式设置（openssl-src 默认从 PATH 找）。
    exec { spec, toolchain ->
        def osName = System.properties['os.name'].toLowerCase()
        if (osName.contains('windows')) {
            spec.environment("OPENSSL_SRC_PERL", "C:/msys64/usr/bin/perl.exe")
            // openssl-src 在 MSYS 里编 OpenSSL 时，若 CC 是 Windows 反斜杠路径，会被 /bin/sh
            // 吞成 "C:Usersted..." 导致 clang 找不到（Error 127）。改为裸 basename 并把 NDK
            // bin 放进 PATH，Configure 生成的 Makefile 里 CC 即 basename，MSYS 可直接执行。
            // 思路与 aw-server-rust/compile-android.sh 的本地修复一致。
            def ndkBin = new File(android.ndkDirectory, "toolchains/llvm/prebuilt/windows-x86_64/bin").path
            // 只用 NDK 提供的 .exe 变体（26）：cc crate 在 Windows 上按 PATHEXT 查找，
            // 24 只有无扩展名 + .cmd，会 "failed to find tool"；26 有 .exe 副本。
            spec.environment("CC_armv7-linux-androideabi", "armv7a-linux-androideabi26-clang.exe")
            spec.environment("CC_aarch64-linux-android", "aarch64-linux-android26-clang.exe")
            // openssl-src 用 MSYS 的 make 跑 OpenSSL，make 需要 sh 在 PATH 里才能执行
            // recipes；clang.exe 归一化后也从 PATH 找。故把 NDK bin 和 MSYS bin 都前置到 PATH。
            def msysBin = "C:/msys64/usr/bin"
            spec.environment("PATH", ndkBin + File.pathSeparator + msysBin + File.pathSeparator + (System.getenv("PATH") ?: ""))
            // openssl-src 在 Windows 上不给 make 传 MAKEFLAGS，导致 OpenSSL 串行编译极慢；
            // 这里显式注入并行度（22 核机器用 -j8 平衡速度与稳定性）。
            // -j8 与双 target 并行曾把系统拖到无响应；降为 -j4，arm/arm64 改为串行构建。
            spec.environment("MAKEFLAGS", "-j4")
        }
    }
}

// Rust 库先于 Android 预编译产出；保留 .so 必检
// 注意：rust-android-gradle 在 afterEvaluate 才创建 cargoBuild task，
// 必须用字符串懒绑定，不能用直接属性引用（否则配置阶段报 unknown property）。
preBuild.dependsOn 'cargoBuild'

