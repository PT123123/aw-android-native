// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.9.20'
    ext.androidXTestVersion = '1.5.0'
    ext.espressoVersion = '3.5.0'
    ext.extJUnitVersion = '1.1.4'
    ext.servicesVersion = '1.4.2'
    repositories {
        google()
        mavenCentral()
        maven { url 'https://mirrors.cloud.tencent.com/maven/central' }
        maven { url 'https://mirrors.huaweicloud.com/repository/maven/' }
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven {url "https://plugins.gradle.org/m2/"}
        
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // 0.9.5 起 linker-wrapper 不再使用 Python 3.13 移除的 pipes 模块
        classpath 'org.mozilla.rust-android-gradle:plugin:0.9.6'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        classpath 'com.google.gms:google-services:4.4.1'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Ignore indexing of some subdirectories
apply plugin: 'idea'
idea {
    module {
        excludeDirs += file('aw-server-rust')
        excludeDirs += file('vendor')
        excludeDirs += file('NDK')
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
    delete file('mobile/src/main/jniLibs')
}

// ======================
// 顶层 Gradle 编排（替代已删除的 Makefile；不引入任何额外工具，Gradle 是唯一总指挥）
// ======================
task build(group: "build", description: "等价 make build：编 Rust + debug APK") {
    dependsOn ':mobile:assembleDebug'
}
task buildApk(group: "build", description: "Release APK：assembleRelease + 复制到 dist/aw-android.apk（签名由 signingConfigs.release 完成）") {
    dependsOn ':mobile:assembleRelease'
    doLast {
        // 配了 keystore.properties → mobile-release.apk（已签名）；没配 → mobile-release-unsigned.apk
        def releaseDir = file('mobile/build/outputs/apk/release')
        def signedApk = new File(releaseDir, 'mobile-release.apk')
        def unsignedApk = new File(releaseDir, 'mobile-release-unsigned.apk')
        def src = signedApk.exists() ? signedApk : unsignedApk
        if (!src.exists()) {
            throw new GradleException("找不到 release APK：${releaseDir}")
        }
        if (src == unsignedApk) {
            logger.warn("[aw] 产出的是**未签名** APK —— 缺 keystore.properties，无法安装分发")
        }
        copy { from src into 'dist' rename { 'aw-android.apk' } }
    }
}
task buildBundle(group: "build", description: "Release AAB：bundleRelease + 复制到 dist/aw-android.aab") {
    dependsOn ':mobile:bundleRelease'
    doLast {
        def bundleDir = file('mobile/build/outputs/bundle/release')
        def aab = new File(bundleDir, 'mobile-release.aab')
        if (!aab.exists()) {
            throw new GradleException("找不到 release AAB：${bundleDir}")
        }
        copy { from aab into 'dist' rename { 'aw-android.aab' } }
    }
}
task install(group: "install", description: "安装 debug APK 到设备") {
    dependsOn ':mobile:installDebug'
}
task testAll(group: "verification", description: "运行单元测试") {
    dependsOn ':mobile:test'
}
task testE2e(group: "verification", description: "运行设备端 E2E 测试") {
    dependsOn ':mobile:connectedAndroidTest'
}
task bumpVersion(type: Exec, group: "build", description: "release 版本自增（改 mobile/build.gradle versionName/versionCode）") {
    commandLine 'bash', 'scripts/bump_version.sh'
}

apply plugin: "com.google.gms.google-services" // 必须存在，且在最后一行
